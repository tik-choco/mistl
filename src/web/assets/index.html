<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mistl dashboard</title>
<style>
  :root {
    color-scheme: dark light;
    --bg: #0f1115;
    --bg-alt: #161923;
    --panel: #1a1e29;
    --panel-border: #2a2f3d;
    --text: #e6e9f0;
    --text-dim: #9aa3b5;
    --text-faint: #6b7385;
    --accent: #5b9dfd;
    --accent-dim: #274261;
    --ok: #3ecf8e;
    --ok-dim: #163c2c;
    --warn: #f0a84e;
    --warn-dim: #45300f;
    --err: #f0605a;
    --err-dim: #46201e;
    --mono: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --radius: 10px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f5f8;
      --bg-alt: #eaecf1;
      --panel: #ffffff;
      --panel-border: #dde1e9;
      --text: #1b1f27;
      --text-dim: #565f70;
      --text-faint: #8790a0;
      --accent: #2064d6;
      --accent-dim: #dbe8ff;
      --ok: #12875a;
      --ok-dim: #dcf3e9;
      --warn: #a8650f;
      --warn-dim: #fbe9d2;
      --err: #c62f29;
      --err-dim: #fbe0de;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.45;
  }
  code, .mono { font-family: var(--mono); }

  header {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    padding: 12px 20px;
    background: var(--bg-alt);
    border-bottom: 1px solid var(--panel-border);
  }
  header h1 {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.02em;
    margin: 0;
  }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    background: var(--panel-border);
    color: var(--text-dim);
  }
  .pill .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--text-faint);
    flex: none;
  }
  .pill.ok { background: var(--ok-dim); color: var(--ok); }
  .pill.ok .dot { background: var(--ok); }
  .pill.err { background: var(--err-dim); color: var(--err); }
  .pill.err .dot { background: var(--err); }

  .identity {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    color: var(--text-dim);
  }
  .identity .name { color: var(--text); font-weight: 600; }
  .copyable {
    cursor: pointer;
    border: none;
    background: none;
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 12px;
    padding: 2px 4px;
    border-radius: 4px;
  }
  .copyable:hover { background: var(--panel-border); color: var(--text); }

  main {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
    gap: 16px;
    padding: 20px;
    max-width: 1600px;
    margin: 0 auto;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: var(--radius);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-width: 0;
  }
  .panel h2 {
    font-size: 13px;
    margin: 0;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .panel h2 .spacer { flex: 1; }
  .panel-span2 { grid-column: span 2; }
  @media (max-width: 760px) {
    .panel-span2 { grid-column: span 1; }
  }

  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; }
  .kv dt { color: var(--text-faint); }
  .kv dd { margin: 0; color: var(--text); word-break: break-all; }

  button {
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 7px;
    border: 1px solid var(--panel-border);
    background: var(--bg-alt);
    color: var(--text);
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: 0.55; cursor: default; }
  button.primary { background: var(--accent-dim); color: var(--accent); border-color: transparent; }
  button.danger { background: var(--err-dim); color: var(--err); border-color: transparent; }
  button.busy { position: relative; color: transparent !important; }
  button.busy::after {
    content: "";
    position: absolute;
    inset: 0;
    margin: auto;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    border: 2px solid currentColor;
    border-top-color: transparent;
    color: var(--text-dim);
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  input[type=text], input[type=password], select, textarea {
    font-family: var(--sans);
    font-size: 13px;
    padding: 6px 9px;
    border-radius: 7px;
    border: 1px solid var(--panel-border);
    background: var(--bg-alt);
    color: var(--text);
    min-width: 0;
  }
  input[type=text]:focus, textarea:focus, select:focus {
    outline: none;
    border-color: var(--accent);
  }
  .field { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 120px; }
  .field label { font-size: 11px; color: var(--text-faint); }
  form.inline { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; }

  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  thead th {
    text-align: left;
    color: var(--text-faint);
    font-weight: 600;
    border-bottom: 1px solid var(--panel-border);
    padding: 4px 6px;
    white-space: nowrap;
  }
  tbody td {
    padding: 5px 6px;
    border-bottom: 1px solid var(--panel-border);
    vertical-align: top;
    word-break: break-word;
  }
  tbody tr:last-child td { border-bottom: none; }
  .table-wrap { overflow-x: auto; max-width: 100%; }
  .empty-note { color: var(--text-faint); font-size: 12.5px; padding: 6px 0; }

  .truncate {
    max-width: 220px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    display: inline-block;
    vertical-align: bottom;
  }

  .chat-log {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 320px;
    overflow-y: auto;
    padding: 8px;
    background: var(--bg-alt);
    border-radius: 8px;
    border: 1px solid var(--panel-border);
  }
  .chat-msg { display: flex; flex-direction: column; gap: 2px; }
  .chat-msg .role { font-size: 11px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.04em; }
  .chat-msg .bubble {
    padding: 8px 10px;
    border-radius: 8px;
    background: var(--panel);
    white-space: pre-wrap;
    word-break: break-word;
  }
  .chat-msg.user .bubble { background: var(--accent-dim); color: var(--text); }
  .chat-msg.error .bubble { background: var(--err-dim); color: var(--err); }
  .chat-empty { color: var(--text-faint); font-size: 12.5px; padding: 4px; }

  .url-callout {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 12px 14px;
    border: 1px solid var(--accent);
    border-radius: 8px;
    background: var(--accent-dim);
    cursor: pointer;
  }
  .url-callout-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--accent);
  }
  .url-callout-url {
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
    word-break: break-all;
  }
  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 999px;
    background: var(--panel-border);
    color: var(--text-dim);
  }
  .badge.delivered, .badge.ok-badge { background: var(--ok-dim); color: var(--ok); }
  .badge.deposited { background: var(--warn-dim); color: var(--warn); }
  .badge.queued { background: var(--panel-border); color: var(--text-dim); }

  .toast-stack {
    position: fixed;
    bottom: 18px;
    right: 18px;
    z-index: 100;
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-width: 360px;
  }
  .toast {
    background: var(--err-dim);
    color: var(--err);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 13px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    box-shadow: 0 4px 18px rgba(0,0,0,0.25);
  }
  .toast button {
    background: none;
    border: none;
    color: inherit;
    font-weight: 700;
    padding: 0 2px;
    margin-left: auto;
  }
  .toast .msg { flex: 1; word-break: break-word; }

  .muted { color: var(--text-faint); }
  .section-actions { display: flex; gap: 8px; margin-left: auto; }
  hr.sep { border: none; border-top: 1px solid var(--panel-border); margin: 4px 0; }
</style>
</head>
<body>

<header>
  <h1>mistl</h1>
  <span id="daemon-pill" class="pill"><span class="dot"></span><span>connecting&hellip;</span></span>
  <div class="identity" id="identity-summary"></div>
</header>

<main id="main">
  <section class="panel" id="panel-overview">
    <h2>Overview <span class="spacer"></span>
      <button id="btn-refresh-overview" data-role="refresh">Refresh</button>
    </h2>
    <dl class="kv" id="overview-kv"></dl>
    <div class="row">
      <button id="btn-stop-daemon" class="danger">Stop daemon</button>
    </div>
  </section>

  <section class="panel" id="panel-stream">
    <h2>Stream <span class="spacer"></span>
      <button data-role="refresh" data-target="stream">Refresh</button>
    </h2>
    <div class="url-callout" id="stream-url-callout" hidden title="Click to copy">
      <span class="url-callout-label">Paste into the VRChat video player</span>
      <span class="url-callout-url mono" id="stream-url-text"></span>
    </div>
    <dl class="kv" id="stream-kv"></dl>
    <div class="row">
      <button id="btn-stream-start" class="primary">Start (this screen)</button>
      <button id="btn-stream-stop" class="danger">Stop</button>
    </div>
    <form class="inline" id="relay-form">
      <div class="field" style="flex: 2;">
        <label for="relay-room">tc-chat room id</label>
        <input type="text" id="relay-room" placeholder="default: stream.relay_room" autocomplete="off">
      </div>
      <button type="submit" class="primary">Relay share to VRChat</button>
    </form>
  </section>

  <section class="panel panel-span2" id="panel-ai">
    <h2>AI <span class="spacer"></span>
      <button data-role="refresh" data-target="ai">Refresh</button>
    </h2>
    <dl class="kv" id="ai-kv"></dl>
    <div class="row">
      <button id="btn-ai-provide-start" class="primary">Start providing</button>
      <button id="btn-ai-provide-stop" class="danger">Stop providing</button>
      <button id="btn-ai-serve-start" class="primary">Start API server</button>
      <button id="btn-ai-serve-stop" class="danger">Stop API server</button>
    </div>
    <div id="ai-models" class="row"></div>
    <hr class="sep">
    <div class="chat-log" id="chat-log">
      <div class="chat-empty">No messages yet.</div>
    </div>
    <form class="inline" id="chat-form">
      <div class="field" style="flex: 3;">
        <label for="chat-prompt">Prompt</label>
        <input type="text" id="chat-prompt" placeholder="Ask something&hellip;" autocomplete="off">
      </div>
      <div class="field" style="flex: 1; min-width: 140px;">
        <label for="chat-model">Model (optional)</label>
        <select id="chat-model"><option value="">default</option></select>
      </div>
      <button type="submit" class="primary" id="btn-chat-send">Send</button>
    </form>
  </section>

  <section class="panel panel-span2" id="panel-mailbox">
    <h2>Mailbox <span class="spacer"></span>
      <button id="btn-mailbox-fetch">Fetch my messages</button>
      <button data-role="refresh" data-target="mailbox-ls">Refresh held</button>
    </h2>
    <div class="table-wrap">
      <table id="mailbox-held-table">
        <thead><tr><th>ID</th><th>From</th><th>To</th><th>Size</th><th>Held since</th></tr></thead>
        <tbody></tbody>
      </table>
      <div class="empty-note" id="mailbox-held-empty">No held deposits.</div>
    </div>
    <div class="table-wrap">
      <table id="mailbox-fetch-table">
        <thead><tr><th>ID</th><th>From</th><th>Content</th></tr></thead>
        <tbody></tbody>
      </table>
      <div class="empty-note" id="mailbox-fetch-empty">Nothing fetched yet.</div>
    </div>
    <hr class="sep">
    <form class="inline" id="mailbox-send-form">
      <div class="field" style="flex: 1; min-width: 160px;">
        <label for="mailbox-to">To (DID or node id)</label>
        <input type="text" id="mailbox-to" autocomplete="off">
      </div>
      <div class="field" style="flex: 2;">
        <label for="mailbox-message">Message</label>
        <input type="text" id="mailbox-message" autocomplete="off">
      </div>
      <button type="submit" class="primary" id="btn-mailbox-send">Send</button>
    </form>
  </section>

  <section class="panel panel-span2" id="panel-store">
    <h2>Store <span class="spacer"></span>
      <button data-role="refresh" data-target="store">Refresh</button>
    </h2>
    <div class="table-wrap">
      <table id="store-table">
        <thead><tr><th>CID</th><th>Name</th><th>Size</th><th>Stored at</th><th>Save to path</th></tr></thead>
        <tbody></tbody>
      </table>
      <div class="empty-note" id="store-empty">No stored items.</div>
    </div>
    <hr class="sep">
    <form class="inline" id="store-put-form">
      <div class="field" style="flex: 1;">
        <label for="store-path">Add file &mdash; local filesystem path (read server-side by the daemon)</label>
        <input type="text" id="store-path" placeholder="C:\path\to\file or /path/to/file" autocomplete="off">
      </div>
      <button type="submit" class="primary" id="btn-store-put">Add</button>
    </form>
  </section>

  <section class="panel" id="panel-profile">
    <h2>Profile <span class="spacer"></span>
      <button data-role="refresh" data-target="profile">Refresh</button>
    </h2>
    <dl class="kv" id="profile-kv"></dl>
    <form class="inline" id="profile-form">
      <div class="field" style="flex: 1;">
        <label for="profile-display-name">Display name</label>
        <input type="text" id="profile-display-name" autocomplete="off">
      </div>
      <button type="submit" class="primary" id="btn-profile-save">Save</button>
    </form>
  </section>
</main>

<div class="toast-stack" id="toast-stack"></div>

<script>
(function () {
  "use strict";

  /* ---------- helpers ---------- */

  function escapeHtml(value) {
    var s = value === null || value === undefined ? "" : String(value);
    return s.replace(/[&<>"']/g, function (ch) {
      switch (ch) {
        case "&": return "&amp;";
        case "<": return "&lt;";
        case ">": return "&gt;";
        case '"': return "&quot;";
        case "'": return "&#39;";
        default: return ch;
      }
    });
  }

  function fmtBytes(n) {
    if (typeof n !== "number" || !isFinite(n)) return "-";
    var units = ["B", "KB", "MB", "GB", "TB"];
    var i = 0;
    var v = n;
    while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
    return (i === 0 ? v.toFixed(0) : v.toFixed(1)) + " " + units[i];
  }

  function fmtUptime(secs) {
    secs = Math.max(0, Math.floor(secs || 0));
    var h = Math.floor(secs / 3600);
    var m = Math.floor((secs % 3600) / 60);
    var s = secs % 60;
    var parts = [];
    if (h > 0) parts.push(h + "h");
    if (h > 0 || m > 0) parts.push(m + "m");
    parts.push(s + "s");
    return parts.join(" ");
  }

  function truncateMiddle(str, head, tail) {
    if (!str) return "";
    head = head || 10;
    tail = tail || 6;
    if (str.length <= head + tail + 1) return str;
    return str.slice(0, head) + "…" + str.slice(str.length - tail);
  }

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        if (k === "class") node.className = attrs[k];
        else if (k === "text") node.textContent = attrs[k];
        else node.setAttribute(k, attrs[k]);
      });
    }
    (children || []).forEach(function (c) { if (c) node.appendChild(c); });
    return node;
  }

  function copyToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(
        function () { showToast("Copied to clipboard.", "info"); },
        function () { showToast("Copy failed.", "error"); }
      );
    } else {
      showToast("Clipboard unavailable.", "error");
    }
  }

  function copyButton(fullValue, displayText, extraClass) {
    var btn = el("button", { type: "button", class: "copyable" + (extraClass ? " " + extraClass : ""), title: fullValue });
    btn.textContent = displayText;
    btn.addEventListener("click", function () { copyToClipboard(fullValue); });
    return btn;
  }

  /* ---------- toasts ---------- */

  var toastStack = document.getElementById("toast-stack");
  var toastSeq = 0;

  function showToast(message, kind) {
    var id = "toast-" + (++toastSeq);
    var toast = el("div", { class: "toast", id: id });
    toast.appendChild(el("span", { class: "msg", text: message }));
    var closeBtn = el("button", { type: "button", "aria-label": "Dismiss" });
    closeBtn.textContent = "×";
    closeBtn.addEventListener("click", function () { dismissToast(id); });
    toast.appendChild(closeBtn);
    toastStack.appendChild(toast);
    if (kind !== "sticky") {
      setTimeout(function () { dismissToast(id); }, 6000);
    }
  }

  function dismissToast(id) {
    var node = document.getElementById(id);
    if (node && node.parentNode) node.parentNode.removeChild(node);
  }

  /* ---------- api ---------- */

  function api(cmd, args) {
    return fetch("/api/call", {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-mistl-ui": "1" },
      body: JSON.stringify({ cmd: cmd, args: args || {} })
    }).then(function (resp) {
      return resp.json().catch(function () {
        throw new Error("invalid response from daemon");
      });
    }, function () {
      throw new Error("daemon unreachable");
    }).then(function (json) {
      if (!json || json.ok !== true) {
        var msg = (json && json.error) || "unknown error";
        throw new Error(msg);
      }
      return json.data;
    });
  }

  function withBusy(button, promiseFn) {
    if (!button) return promiseFn();
    button.disabled = true;
    button.classList.add("busy");
    return promiseFn().then(
      function (v) { button.disabled = false; button.classList.remove("busy"); return v; },
      function (err) { button.disabled = false; button.classList.remove("busy"); throw err; }
    );
  }

  function runAction(button, cmd, args, onSuccess) {
    withBusy(button, function () { return api(cmd, args); }).then(
      function (data) { if (onSuccess) onSuccess(data); },
      function (err) { showToast(err.message || String(err)); }
    );
  }

  /* ---------- state ---------- */

  var state = {
    daemon: null,
    daemonUptimeBase: null,
    daemonUptimeAt: 0,
    identity: null,
    stream: null,
    ai: null,
    chatHistory: []
  };

  /* ---------- header ---------- */

  var daemonPill = document.getElementById("daemon-pill");
  var identitySummary = document.getElementById("identity-summary");

  function renderDaemonPill() {
    daemonPill.innerHTML = "";
    var dot = el("span", { class: "dot" });
    var label;
    if (state.daemon) {
      daemonPill.className = "pill ok";
      var uptime = state.daemonUptimeBase !== null
        ? state.daemonUptimeBase + Math.floor((Date.now() - state.daemonUptimeAt) / 1000)
        : state.daemon.uptime_secs;
      label = el("span", { text: "running · pid " + state.daemon.pid + " · v" + state.daemon.version + " · " + fmtUptime(uptime) });
    } else {
      daemonPill.className = "pill err";
      label = el("span", { text: "daemon unreachable" });
    }
    daemonPill.appendChild(dot);
    daemonPill.appendChild(label);
  }

  function renderIdentitySummary() {
    identitySummary.innerHTML = "";
    if (!state.identity) return;
    var name = state.identity.display_name || "(no name)";
    identitySummary.appendChild(el("span", { class: "name", text: name }));
    var did = state.identity.did || "";
    if (did) {
      identitySummary.appendChild(copyButton(did, truncateMiddle(did, 14, 6)));
    }
  }

  /* ---------- overview panel ---------- */

  var overviewKv = document.getElementById("overview-kv");

  function renderOverview() {
    overviewKv.innerHTML = "";
    if (!state.daemon) {
      overviewKv.appendChild(el("dt", { text: "status" }));
      overviewKv.appendChild(el("dd", { text: "daemon unreachable" }));
      return;
    }
    var uptime = state.daemonUptimeBase !== null
      ? state.daemonUptimeBase + Math.floor((Date.now() - state.daemonUptimeAt) / 1000)
      : state.daemon.uptime_secs;
    addKv(overviewKv, "pid", state.daemon.pid);
    addKv(overviewKv, "version", state.daemon.version);
    addKv(overviewKv, "uptime", fmtUptime(uptime));
  }

  function addKv(container, key, value, mono) {
    container.appendChild(el("dt", { text: key }));
    var dd = el("dd", {});
    if (mono) dd.classList.add("mono");
    dd.textContent = value === null || value === undefined || value === "" ? "-" : String(value);
    container.appendChild(dd);
  }

  function pollDaemonStatus() {
    return api("daemon.status", {}).then(function (data) {
      state.daemon = data;
      state.daemonUptimeBase = data.uptime_secs;
      state.daemonUptimeAt = Date.now();
      renderDaemonPill();
      renderOverview();
    }, function (err) {
      state.daemon = null;
      renderDaemonPill();
      renderOverview();
      showToast("daemon.status: " + err.message);
    });
  }

  document.getElementById("btn-refresh-overview").addEventListener("click", function (e) {
    runAction(e.currentTarget, "daemon.status", {}, function (data) {
      state.daemon = data;
      state.daemonUptimeBase = data.uptime_secs;
      state.daemonUptimeAt = Date.now();
      renderDaemonPill();
      renderOverview();
    });
  });

  document.getElementById("btn-stop-daemon").addEventListener("click", function (e) {
    if (!confirm("Stop the mistl daemon? This will end all active sessions.")) return;
    runAction(e.currentTarget, "daemon.stop", {}, function () {
      showToast("Daemon is stopping.");
    });
  });

  /* ---------- stream panel ---------- */

  var streamKv = document.getElementById("stream-kv");
  var streamUrlCallout = document.getElementById("stream-url-callout");
  var streamUrlText = document.getElementById("stream-url-text");

  streamUrlCallout.addEventListener("click", function () {
    if (streamUrlText.textContent) copyToClipboard(streamUrlText.textContent);
  });

  function renderStream() {
    streamKv.innerHTML = "";
    var s = state.stream;
    if (!s) {
      addKv(streamKv, "status", "unknown");
      streamUrlCallout.hidden = true;
      return;
    }
    if (s.running) {
      streamUrlText.textContent = s.rtsp_url;
      streamUrlCallout.hidden = false;
      addKv(streamKv, "status", "running");
      addKv(streamKv, "clients", s.clients);
      addKv(streamKv, "backend", s.backend);
      if (s.room) addKv(streamKv, "relay room", s.room);
      if (s.backend === "relay") {
        addKv(streamKv, "publisher", s.publisher ? s.publisher : "waiting for a share…");
      }
      addKv(streamKv, "uptime", fmtUptime(s.uptime_secs));
    } else {
      streamUrlCallout.hidden = true;
      addKv(streamKv, "status", "stopped");
    }
  }

  function pollStreamStatus() {
    return api("stream.status", {}).then(function (data) {
      state.stream = data;
      renderStream();
    }, function () {
      state.stream = null;
      renderStream();
    });
  }

  document.querySelector('[data-target="stream"]').addEventListener("click", function (e) {
    runAction(e.currentTarget, "stream.status", {}, function (data) {
      state.stream = data;
      renderStream();
    });
  });

  document.getElementById("btn-stream-start").addEventListener("click", function (e) {
    runAction(e.currentTarget, "stream.start", {}, function () {
      showToast("Stream started.");
      pollStreamStatus();
    });
  });

  document.getElementById("btn-stream-stop").addEventListener("click", function (e) {
    if (!confirm("Stop the stream?")) return;
    runAction(e.currentTarget, "stream.stop", {}, function () {
      showToast("Stream stopped.");
      pollStreamStatus();
    });
  });

  document.getElementById("relay-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var room = document.getElementById("relay-room").value.trim();
    var btn = e.target.querySelector("button[type=submit]");
    runAction(btn, "stream.relay.start", room ? { room: room } : {}, function (data) {
      showToast("Relay started" + (data.room ? " in room " + data.room : "") + ".");
      pollStreamStatus();
    });
  });

  /* ---------- ai panel ---------- */

  var aiKv = document.getElementById("ai-kv");
  var aiModelsBox = document.getElementById("ai-models");
  var chatModelSelect = document.getElementById("chat-model");

  function renderAi() {
    aiKv.innerHTML = "";
    var a = state.ai;
    if (!a) {
      addKv(aiKv, "status", "unknown");
      aiModelsBox.innerHTML = "";
      return;
    }
    addKv(aiKv, "room", a.room);
    addKv(aiKv, "node id", a.node_id, true);
    addKv(aiKv, "connected peers", a.connected_peers);
    addKv(aiKv, "providing", a.providing ? "yes" : "no");
    addKv(aiKv, "serving", a.serving ? a.serving : "no");
    if (a.remote_provider) {
      addKv(aiKv, "remote provider", a.remote_provider.node_id, true);
    }

    aiModelsBox.innerHTML = "";
    var models = a.models || (a.remote_provider && a.remote_provider.models) || [];
    if (models.length) {
      aiModelsBox.appendChild(el("span", { class: "muted", text: "models:" }));
      models.forEach(function (m) {
        aiModelsBox.appendChild(el("span", { class: "badge", text: m }));
      });
    }

    var prevSelected = chatModelSelect.value;
    chatModelSelect.innerHTML = "";
    chatModelSelect.appendChild(el("option", { value: "", text: "default" }));
    models.forEach(function (m) {
      var opt = el("option", { value: m, text: m });
      chatModelSelect.appendChild(opt);
    });
    if (models.indexOf(prevSelected) !== -1) chatModelSelect.value = prevSelected;
  }

  function pollAiStatus() {
    return api("ai.status", {}).then(function (data) {
      state.ai = data;
      renderAi();
    }, function () {
      state.ai = null;
      renderAi();
    });
  }

  document.querySelector('[data-target="ai"]').addEventListener("click", function (e) {
    runAction(e.currentTarget, "ai.status", {}, function (data) {
      state.ai = data;
      renderAi();
    });
  });

  document.getElementById("btn-ai-provide-start").addEventListener("click", function (e) {
    runAction(e.currentTarget, "ai.provide.start", {}, function (data) {
      showToast(data.already_running ? "Already providing." : "Now providing AI models.");
      pollAiStatus();
    });
  });

  document.getElementById("btn-ai-provide-stop").addEventListener("click", function (e) {
    runAction(e.currentTarget, "ai.provide.stop", {}, function (data) {
      showToast(data.was_running ? "Stopped providing." : "Was not providing.");
      pollAiStatus();
    });
  });

  document.getElementById("btn-ai-serve-start").addEventListener("click", function (e) {
    runAction(e.currentTarget, "ai.serve.start", {}, function (data) {
      showToast(data.already_running ? "API server already running at " + data.listen : "API server listening at " + data.listen);
      pollAiStatus();
    });
  });

  document.getElementById("btn-ai-serve-stop").addEventListener("click", function (e) {
    runAction(e.currentTarget, "ai.serve.stop", {}, function (data) {
      showToast(data.was_running ? "API server stopped." : "API server was not running.");
      pollAiStatus();
    });
  });

  /* ---------- chat ---------- */

  var chatLog = document.getElementById("chat-log");
  var chatForm = document.getElementById("chat-form");
  var chatPromptInput = document.getElementById("chat-prompt");
  var btnChatSend = document.getElementById("btn-chat-send");

  function renderChat() {
    chatLog.innerHTML = "";
    if (!state.chatHistory.length) {
      chatLog.appendChild(el("div", { class: "chat-empty", text: "No messages yet." }));
      return;
    }
    state.chatHistory.forEach(function (msg) {
      var wrap = el("div", { class: "chat-msg " + msg.role });
      wrap.appendChild(el("div", { class: "role", text: msg.role === "user" ? "you" : (msg.role === "error" ? "error" : (msg.via ? msg.via : "assistant")) }));
      var bubble = el("div", { class: "bubble" });
      bubble.textContent = msg.text;
      wrap.appendChild(bubble);
      chatLog.appendChild(wrap);
    });
    chatLog.scrollTop = chatLog.scrollHeight;
  }

  chatForm.addEventListener("submit", function (e) {
    e.preventDefault();
    var prompt = chatPromptInput.value.trim();
    if (!prompt) return;
    var model = chatModelSelect.value || undefined;
    state.chatHistory.push({ role: "user", text: prompt });
    renderChat();
    chatPromptInput.value = "";
    var args = { prompt: prompt };
    if (model) args.model = model;
    withBusy(btnChatSend, function () { return api("ai.chat", args); }).then(
      function (data) {
        state.chatHistory.push({ role: "assistant", via: data.via, text: data.content });
        renderChat();
      },
      function (err) {
        var msg = err.message || String(err);
        state.chatHistory.push({ role: "error", text: msg });
        renderChat();
        showToast("ai.chat: " + msg);
      }
    );
  });

  /* ---------- mailbox ---------- */

  var mailboxHeldTbody = document.querySelector("#mailbox-held-table tbody");
  var mailboxHeldEmpty = document.getElementById("mailbox-held-empty");
  var mailboxFetchTbody = document.querySelector("#mailbox-fetch-table tbody");
  var mailboxFetchEmpty = document.getElementById("mailbox-fetch-empty");

  function renderMailboxHeld(items) {
    mailboxHeldTbody.innerHTML = "";
    items = items || [];
    mailboxHeldEmpty.style.display = items.length ? "none" : "block";
    items.forEach(function (item) {
      var tr = el("tr", {});
      var idCell = el("td", { class: "mono" });
      idCell.textContent = truncateMiddle(String(item.id), 10, 4);
      tr.appendChild(idCell);
      var fromCell = el("td", { class: "mono" });
      fromCell.textContent = truncateMiddle(String(item.from), 12, 6);
      tr.appendChild(fromCell);
      var toCell = el("td", { class: "mono" });
      toCell.textContent = truncateMiddle(String(item.to), 12, 6);
      tr.appendChild(toCell);
      tr.appendChild(el("td", { text: fmtBytes(item.size) }));
      tr.appendChild(el("td", { text: item.held_since || "-" }));
      mailboxHeldTbody.appendChild(tr);
    });
  }

  function renderMailboxFetch(items) {
    mailboxFetchTbody.innerHTML = "";
    items = items || [];
    mailboxFetchEmpty.style.display = items.length ? "none" : "block";
    items.forEach(function (item) {
      var tr = el("tr", {});
      var idCell = el("td", { class: "mono" });
      idCell.textContent = truncateMiddle(String(item.id), 10, 4);
      tr.appendChild(idCell);
      var fromCell = el("td", { class: "mono" });
      fromCell.textContent = truncateMiddle(String(item.from), 12, 6);
      tr.appendChild(fromCell);
      var contentCell = el("td", {});
      if (item.message !== undefined && item.message !== null) {
        contentCell.textContent = item.message;
      } else if (item.file) {
        contentCell.textContent = "file: " + item.file.name + " (" + fmtBytes(item.file.size) + ", cid " + truncateMiddle(item.file.cid, 8, 4) + ")";
      } else {
        contentCell.textContent = "-";
      }
      tr.appendChild(contentCell);
      mailboxFetchTbody.appendChild(tr);
    });
  }

  function pollMailboxLs() {
    return api("mailbox.ls", {}).then(function (data) {
      renderMailboxHeld(data);
    }, function (err) {
      showToast("mailbox.ls: " + err.message);
    });
  }

  document.querySelector('[data-target="mailbox-ls"]').addEventListener("click", function (e) {
    runAction(e.currentTarget, "mailbox.ls", {}, renderMailboxHeld);
  });

  document.getElementById("btn-mailbox-fetch").addEventListener("click", function (e) {
    runAction(e.currentTarget, "mailbox.fetch", {}, renderMailboxFetch);
  });

  document.getElementById("mailbox-send-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var to = document.getElementById("mailbox-to").value.trim();
    var message = document.getElementById("mailbox-message").value.trim();
    if (!to || !message) {
      showToast("Recipient and message are both required.");
      return;
    }
    var btn = document.getElementById("btn-mailbox-send");
    runAction(btn, "mailbox.send", { to: to, message: message }, function (data) {
      showToast("Message " + data.status + " (id " + truncateMiddle(String(data.id), 8, 4) + ").");
      document.getElementById("mailbox-message").value = "";
      pollMailboxLs();
    });
  });

  /* ---------- store ---------- */

  var storeTbody = document.querySelector("#store-table tbody");
  var storeEmpty = document.getElementById("store-empty");

  function renderStore(items) {
    storeTbody.innerHTML = "";
    items = items || [];
    storeEmpty.style.display = items.length ? "none" : "block";
    items.forEach(function (entry) {
      var tr = el("tr", {});
      var cidCell = el("td", {});
      cidCell.appendChild(copyButton(entry.cid, truncateMiddle(entry.cid, 10, 6), "mono"));
      tr.appendChild(cidCell);
      tr.appendChild(el("td", { text: entry.name }));
      tr.appendChild(el("td", { text: fmtBytes(entry.size) }));
      tr.appendChild(el("td", { text: entry.stored_at || "-" }));

      var actionCell = el("td", {});
      var form = el("form", { class: "row" });
      form.style.margin = "0";
      var input = el("input", { type: "text", placeholder: "output path (optional)" });
      input.style.width = "140px";
      var btn = el("button", { type: "submit", text: "Save" });
      form.appendChild(input);
      form.appendChild(btn);
      form.addEventListener("submit", function (ev) {
        ev.preventDefault();
        var args = { id: entry.cid };
        var outputPath = input.value.trim();
        if (outputPath) args.output = outputPath;
        runAction(btn, "store.get", args, function (data) {
          showToast("Saved to " + data.output);
        });
      });
      actionCell.appendChild(form);
      tr.appendChild(actionCell);

      storeTbody.appendChild(tr);
    });
  }

  function pollStoreLs() {
    return api("store.ls", {}).then(renderStore, function (err) {
      showToast("store.ls: " + err.message);
    });
  }

  document.querySelector('[data-target="store"]').addEventListener("click", function (e) {
    runAction(e.currentTarget, "store.ls", {}, renderStore);
  });

  document.getElementById("store-put-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var pathInput = document.getElementById("store-path");
    var path = pathInput.value.trim();
    if (!path) return;
    var btn = document.getElementById("btn-store-put");
    runAction(btn, "store.put", { path: path }, function (data) {
      showToast("Stored " + data.name + " (" + fmtBytes(data.size) + ").");
      pathInput.value = "";
      pollStoreLs();
    });
  });

  /* ---------- profile ---------- */

  var profileKv = document.getElementById("profile-kv");
  var profileDisplayNameInput = document.getElementById("profile-display-name");

  function renderProfile(data) {
    profileKv.innerHTML = "";
    if (!data) return;
    addKv(profileKv, "did", truncateMiddle(data.did || "", 16, 8), true);
    addKv(profileKv, "display name", data.display_name || "");
    addKv(profileKv, "bio", data.bio || "");
    addKv(profileKv, "avatar", data.avatar || "");
    Object.keys(data).forEach(function (key) {
      if (["did", "display_name", "bio", "avatar"].indexOf(key) === -1) {
        addKv(profileKv, key, data[key]);
      }
    });
    state.identity = data;
    renderIdentitySummary();
    profileDisplayNameInput.value = data.display_name || "";
  }

  function pollProfile() {
    return api("profile.show", {}).then(renderProfile, function (err) {
      showToast("profile.show: " + err.message);
    });
  }

  document.querySelector('[data-target="profile"]').addEventListener("click", function (e) {
    runAction(e.currentTarget, "profile.show", {}, renderProfile);
  });

  document.getElementById("profile-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var value = profileDisplayNameInput.value.trim();
    var btn = document.getElementById("btn-profile-save");
    runAction(btn, "profile.set", { field: "display_name", value: value }, function (data) {
      showToast("Profile updated.");
      renderProfile(data);
    });
  });

  /* ---------- polling scheduler ---------- */

  var pollTimer = null;
  var POLL_INTERVAL_MS = 5000;
  var tickTimer = null;

  function pollAll() {
    pollDaemonStatus();
    pollStreamStatus();
    pollAiStatus();
  }

  function startPolling() {
    if (pollTimer) return;
    pollAll();
    pollTimer = setInterval(pollAll, POLL_INTERVAL_MS);
  }

  function stopPolling() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  }

  function startTicker() {
    if (tickTimer) return;
    tickTimer = setInterval(function () {
      if (state.daemon) renderDaemonPill();
      if (state.daemon) renderOverview();
    }, 1000);
  }

  function stopTicker() {
    if (tickTimer) { clearInterval(tickTimer); tickTimer = null; }
  }

  document.addEventListener("visibilitychange", function () {
    if (document.hidden) {
      stopPolling();
      stopTicker();
    } else {
      startPolling();
      startTicker();
    }
  });

  /* ---------- init ---------- */

  renderChat();
  startPolling();
  startTicker();
  pollProfile();
  pollMailboxLs();
  pollStoreLs();
})();
</script>
</body>
</html>

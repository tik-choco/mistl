# Tag-driven release: pushing a `v*` tag builds mistl for Windows / macOS /
# Linux and publishes a GitHub Release with auto-generated notes. Tags with a
# semver prerelease suffix (`v0.2.0-beta.1`) become GitHub prereleases, which
# only `update.prerelease = true` installs pick up. Create tags with
# `just publish beta|stable` (scripts/publish.mjs) rather than by hand.
# Pushes to main / develop run the same verification without publishing.
#
# The version is taken from the tag and stamped into Cargo.toml before
# building, so `mistl --version` matches the tag without a manual bump.
#
# The mistlib / mistlib-consensus path dependencies are checked out into
# .mistlib-src/ and .mistlib-consensus-src/ (the same locations the local
# scripts/fetch-mistlib* put them, so Cargo.toml needs no CI special-case).
# Both source repositories are public, so the default GITHUB_TOKEN is enough.
# Optional repository secret:
#   MISTLIB_DEV_TOKEN - fine-grained PAT with Contents: Read, only needed if
#                       MISTLIB_REPO below is pointed back at the private
#                       tik-choco-lab/mistlib-dev repository.
# Release signing (optional; see docs/release-signing.md): the repository
# variable MISTL_RELEASE_PUBKEY is compiled into the binary, and the signing
# key is read from repository secrets.

name: release

on:
  push:
    branches: [main, develop]
    # Path filters are not evaluated for tag pushes.
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  MISTL_BUILD_CHANNEL: stable
  # Public mistlib. Switch to tik-choco-lab/mistlib-dev + develop (and set the
  # MISTLIB_DEV_TOKEN secret) to build against unreleased mistlib commits.
  MISTLIB_REPO: tik-choco-lab/mistlib
  MISTLIB_REF: 170420b05045ee76b6f220d3d01cc31a834f9061
  MISTLIB_CONSENSUS_REPO: tik-choco-lab/mistlib-consensus
  MISTLIB_CONSENSUS_REF: a80f80b22de5466387fd9f93e63a3e793ff2f456
  # Runner cmake is 4.x; vendored libopus still declares an ancient minimum.
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Pick the version
        id: ver
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
              echo "::error::tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH[-PRERELEASE]"
              exit 1
            fi
          else
            # Branch push: verification only, the Cargo.toml version is fine.
            version=$(sed -nE 's/^version *= *"([^"]+)".*/\1/p' Cargo.toml | head -1)
          fi
          case "$version" in *-*) prerelease=true ;; *) prerelease=false ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "version: v$version (prerelease: $prerelease, ref: $GITHUB_REF)"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # Path dependency `.mistlib-src/` (same location the local
      # scripts/fetch-mistlib puts it, so Cargo.toml needs no CI special-case).
      # The default token covers the public repo; MISTLIB_DEV_TOKEN takes over
      # when MISTLIB_REPO points at the private mistlib-dev.
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.MISTLIB_REPO }}
          ref: ${{ env.MISTLIB_REF }}
          token: ${{ secrets.MISTLIB_DEV_TOKEN || github.token }}
          path: .mistlib-src

      # Path dependency `.mistlib-consensus-src/` (same location the local
      # scripts/fetch-mistlib-consensus puts it).
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.MISTLIB_CONSENSUS_REPO }}
          ref: ${{ env.MISTLIB_CONSENSUS_REF }}
          token: ${{ secrets.MISTLIB_DEV_TOKEN || github.token }}
          path: .mistlib-consensus-src

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake nasm pkg-config libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Embed release public key
        # Only exported when the repository variable is set; option_env! in
        # src/update sees it at compile time.
        env:
          PUBKEY: ${{ vars.MISTL_RELEASE_PUBKEY }}
        run: |
          if [ -n "$PUBKEY" ]; then
            echo "MISTL_RELEASE_PUBKEY=$PUBKEY" >> "$GITHUB_ENV"
          else
            echo "::warning::MISTL_RELEASE_PUBKEY is not set; this build cannot verify update signatures"
          fi

      - name: Stamp release version into Cargo.toml
        # Only the [package] section has `version =` at column 0.
        run: sed -i.bak -E 's/^version = "[^"]*"/version = "${{ needs.plan.outputs.version }}"/' Cargo.toml && rm Cargo.toml.bak

      # Test on the runner's native architecture (the macOS x86_64 build
      # can be cross-compiled on an ARM runner). Publishing requires this.
      - name: Test
        run: cargo test -- --test-threads=1

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        # Ship BOTH an archive (for humans) and the raw binary named per
        # target. The self-updater (`mistl update`) downloads the raw binary
        # and verifies it against SHA256SUMS.txt, so it never has to unpack an
        # archive to replace the running exe.
        run: |
          name="mistl-v${{ needs.plan.outputs.version }}-${{ matrix.target }}"
          mkdir -p dist
          case "${{ matrix.target }}" in
            *windows*)
              cp "target/${{ matrix.target }}/release/mistl.exe" .
              7z a "dist/$name.zip" mistl.exe README.md
              cp mistl.exe "dist/$name.exe"
              ;;
            *)
              cp "target/${{ matrix.target }}/release/mistl" .
              tar czf "dist/$name.tar.gz" mistl README.md
              cp mistl "dist/$name"
              ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: mistl-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [plan, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt

      - name: Sign checksums (minisign)
        # Skipped when MINISIGN_SECRET_KEY is not configured, so releases keep
        # working (unsigned) until the key is set up.
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "::warning::MINISIGN_SECRET_KEY is not set; publishing without SHA256SUMS.txt.minisig"
            exit 0
          fi
          # From the signed Ubuntu archive rather than an unverified download.
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign
          umask 077
          keyfile="$RUNNER_TEMP/minisign.key"
          trap 'rm -f "$keyfile"' EXIT
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$keyfile"
          printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$keyfile" \
            -m dist/SHA256SUMS.txt -t "mistl v${{ needs.plan.outputs.version }}"
          ls -l dist/SHA256SUMS.txt.minisig

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.plan.outputs.version }}
          name: MISTL v${{ needs.plan.outputs.version }}
          prerelease: ${{ needs.plan.outputs.prerelease }}
          # A beta must not become the "Latest" release stable updaters fetch.
          make_latest: ${{ needs.plan.outputs.prerelease == 'true' && 'false' || 'true' }}
          generate_release_notes: true
          files: dist/*

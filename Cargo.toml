[package]
name = "mistl"
version = "0.1.0"
edition = "2024"
description = "Unified P2P daemon CLI: identity (DID), storage, RTSP screen share for VRChat, and offline mailbox bot"
license = "MPL-2.0"

[dependencies]
# mistlib workspace (path deps; mistlib-native's lib name is `mistlib`).
# .mistlib-src is a git clone managed by scripts/fetch-mistlib (repo/ref set
# in .env; `just fetch-mistlib` to update, first `just build` fetches it).
mistlib-core = { path = ".mistlib-src/mistlib-core" }
mistlib-native = { path = ".mistlib-src/mistlib-native" }

# CLI / runtime / config
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_cbor = "0.11"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "5"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
bytes = "1"

# identity / crypto (tc-storage interop: did:key ed25519, AES-256-GCM + PBKDF2)
ed25519-dalek = { version = "2", features = ["pkcs8", "rand_core"] }
bs58 = "0.5"
aes-gcm = "0.10"
pbkdf2 = "0.12"
sha2 = "0.10"
base64 = "0.22"

# ai (p2p LLM network, mistai wire-compatible; upstream OpenAI-compatible client)
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }

# stream (RTSP server + MPEG-TS ingest, VRChat/AVPro compatible)
rtsp-types = "0.1"
mpeg2ts = "0.3"
rtp = "0.13"
openh264 = "0.9.3"

# stream::relay (tc-chat WebRTC share -> RTSP): Opus decode (audiopus_sys
# builds libopus from source via cmake, matching the openh264 precedent) and
# AAC-LC encode (fdk-aac-sys builds libfdk-aac from source via cc).
opus = "0.3"
fdk-aac = "0.8"

# self-update (GitHub Releases): version compare + atomic replace of the
# running executable (handles the Windows "can't delete a running exe" dance).
semver = "1"
# crates.io package is `self-replace`; keep the `self_replace` import name.
self_replace = { package = "self-replace", version = "1" }

[profile.release]
lto = "thin"
strip = true

[target."cfg(windows)".dependencies]
windows-capture = "2.0.0"
# Per-user login autostart (HKCU\...\Run) for `mistl autostart`.
winreg = "0.52"

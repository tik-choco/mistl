[package]
name = "mistl"
version = "0.1.0"
edition = "2024"
description = "Unified P2P daemon CLI: identity (DID), storage, RTSP screen share for VRChat, and a standing tc-chat relay"
license = "MPL-2.0"

[dependencies]
# mistlib workspace (path deps; mistlib-native's lib name is `mistlib`).
# .mistlib-src is a git clone managed by scripts/fetch-mistlib (repo/ref set
# in .env; `just fetch-mistlib` to update, first `just build` fetches it).
mistlib-core = { path = ".mistlib-src/mistlib-core" }
mistlib-native = { path = ".mistlib-src/mistlib-native" }

# mistlib-consensus workspace (path deps; same vendoring pattern as mistlib
# above, driven by scripts/fetch-mistlib-consensus and
# MISTLIB_CONSENSUS_REPO/MISTLIB_CONSENSUS_REF in .env). See `[patch]` below:
# mistlib-consensus depends on mistlib-core as a git dependency, which must
# be unified with our path dependency above so both crate graphs share one
# `NodeId`/`AsyncRuntime` type.
mistlib-consensus-core = { path = ".mistlib-consensus-src/mistlib-consensus-core" }
mistlib-consensus-native = { path = ".mistlib-consensus-src/mistlib-consensus-native" }

# CLI / runtime / config
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_cbor = "0.11"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "5"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
bytes = "1"

# scheduler (cron-like job scheduler ported from tc-sched): 6-field
# (with-seconds) cron expression parsing/evaluation, chrono-based like the
# timestamps stored elsewhere in this crate.
cron = "0.12"

# identity / crypto (tc-storage interop: did:key ed25519, AES-256-GCM + PBKDF2)
ed25519-dalek = { version = "2", features = ["pkcs8", "rand_core"] }
bs58 = "0.5"
aes-gcm = "0.10"
pbkdf2 = "0.12"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"

# storage::folder_share (tc-storage folder-share access-grant crypto): ECDH
# P-256 where the shared secret's raw X coordinate is used directly as an
# AES-256 key (matches tc-storage's `internal/protocol/accessgrant.go` and
# the web app's `src/crypto/accessGrantCrypto.ts`). Already resolved
# transitively via webrtc-dtls (part of mistlib's WebRTC stack); declared
# directly here so `storage::folder_share` can use it.
p256 = { version = "0.13", features = ["ecdh"] }

# ai (p2p LLM network, mistai wire-compatible; upstream OpenAI-compatible client).
# "multipart" backs the STT upstream client (src/ai/stt.rs), which POSTs
# audio bytes to /audio/transcriptions as multipart/form-data.
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "multipart"] }

# stream (RTSP server + MPEG-TS ingest, VRChat/AVPro compatible)
rtsp-types = "0.1"
mpeg2ts = "0.3"
rtp = "0.13"
openh264 = "0.9.3"

# stream::relay (tc-chat WebRTC share -> RTSP): Opus decode (audiopus_sys
# builds libopus from source via cmake, matching the openh264 precedent) and
# AAC-LC encode (fdk-aac-sys builds libfdk-aac from source via cc).
opus = "0.3"
fdk-aac = "0.8"

# consensus (Raft control plane for stream relay leader election): bincode
# is the wire format mistlib-consensus-core's RaftMessage is serialized
# with, matching what our own transport envelope carries; async-trait
# implements its RaftTransport trait (same version consensus-core itself
# uses, so the attribute-generated futures agree).
bincode = "1.3"
async-trait = "0.1"

# tunnel (P2P port forwarding, ported from the standalone `p2p` crate):
# ratatui backs `mistl tunnel tui`, hex encodes generated room ids, and uuid
# generates the per-connection / per-request ids the tunnel wire protocol
# carries as opaque strings.
ratatui = "0.29"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }

# self-update (GitHub Releases): version compare + atomic replace of the
# running executable (handles the Windows "can't delete a running exe" dance).
semver = "1"
# crates.io package is `self-replace`; keep the `self_replace` import name.
self_replace = { package = "self-replace", version = "1" }

[dev-dependencies]
# tunnel tests scope env vars (config/data dir overrides) per test, the same
# way the upstream `p2p` crate's tests did.
temp-env = "0.3"
# `test-util` (not part of the `full` feature set the main dependency enables)
# backs `Builder::start_paused` / `time::advance`, which the ported tunnel
# tests use to drive retry backoff and peer-leave grace windows without
# actually sleeping. Same dev-dependency the upstream `p2p` crate carried.
tokio = { version = "1", features = ["test-util"] }

[profile.release]
lto = "thin"
strip = true

[profile.dev]
# Windows `.pdb` files were 6.59 GB of this crate's 60.23 GB debug target dir
# — full debuginfo is the most expensive single component of a debug build
# here, and it goes almost entirely unused: debugging in this project is
# `tracing` output, not a stepping debugger. `line-tables-only` keeps what
# that style needs (file and line numbers in panics and backtraces) and drops
# the variable/type information a symbolic debugger would want.
#
# Set it back to `true` for a session where you genuinely need to inspect
# variables in WinDbg/VS; it costs a rebuild, not a redesign.
debug = "line-tables-only"

[target."cfg(windows)".dependencies]
windows-capture = "2.0.0"
# Per-user login autostart (HKCU\...\Run) for `mistl autostart`.
winreg = "0.52"

# mistlib-consensus's crates depend on mistlib-core as a git dependency
# (tik-choco-lab/mistlib, the public mirror of the mistlib-dev repo mistl
# vendors via .mistlib-src), while mistl itself uses a path dependency on that
# local checkout. Without unifying them, the two dependency graphs would each
# compile their own copy of mistlib-core, and consensus-core's public API
# (mistlib_core::types::NodeId, mistlib_core::runtime::AsyncRuntime) would be
# a *different* type than the one in scope here -- a hard type error at the
# consensus/mistlib integration boundary. These patches redirect every git
# dependency on either URL (regardless of `rev`/`tag`) to the local path
# checkout. Both mirrors are listed because consensus moved its pin from
# mistlib-dev to the public repo, and either may be what a given checkout of
# .mistlib-consensus-src asks for.
[patch."https://github.com/tik-choco-lab/mistlib.git"]
mistlib-core = { path = ".mistlib-src/mistlib-core" }

[patch."https://github.com/tik-choco-lab/mistlib-dev.git"]
mistlib-core = { path = ".mistlib-src/mistlib-core" }
